server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's embedded DNS. Resolving the upstream at request time (via the
    # $api_upstream variable below) means nginx still starts when the api
    # container is not running yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same shape as the Vite dev proxy: /api/tasks -> api:8080/tasks
    location /api/ {
        set $api_upstream http://api:8080;
        # proxy_pass with a variable does not swap the /api/ prefix for a URI
        # the way a literal address does, so the prefix is cut off here.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
