# Frontend + api + database.
#
# Run the whole stack:    docker compose up --build
# Run only the database:  docker compose up -d db
#   (then start the api on the host: cd backend && bun run start)
services:
  web:
    build: ./frontend
    ports:
      - "5173:80"
    restart: unless-stopped
    depends_on: [api]

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: restapi
      POSTGRES_PASSWORD: restapi
      POSTGRES_DB: tasks
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restapi -d tasks"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # The context is the repo root because the server reads migrations/.
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://restapi:restapi@db:5432/tasks
      # The default, 127.0.0.1, is loopback inside the container: `web` could
      # not reach it.
      HOST: 0.0.0.0
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  pgdata:
